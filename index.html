<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerLens - Connected Career & Enterprise Hiring Ecosystem</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb', // Electric Sapphire Blue
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              900: '#0f172a',
            }
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.03)',
            'card-hover': '0 12px 28px -4px rgba(37, 99, 235, 0.12), 0 6px 12px -4px rgba(15, 23, 42, 0.05)'
          }
        }
      }
    }
  </script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full antialiased font-sans text-slate-900 selection:bg-indigo-500 selection:text-white">
  <!-- Dynamic Application Root -->
  <div id="app-root" class="min-h-full flex flex-col">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- Application Controller Script -->
  <script src="app.js"></script>
</body>
</html>
